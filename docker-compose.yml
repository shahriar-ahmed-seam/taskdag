version: "3.8"

services:
  taskdag-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskdag-console
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
